name: Pindrop
description: >-
  Pindrop is a voice and audio security company providing a continuous identity
  verification and deepfake-detection platform for enterprises. Its technology
  authenticates callers and video-meeting participants, detects synthetic
  (AI-generated) speech and fraudulent activity, and protects contact centers,
  virtual meetings, and connected devices. Pindrop's products span call-center
  fraud detection, passive voice authentication, and liveness/deepfake defense,
  and are delivered largely through partner platforms (Amazon Connect, Zoom,
  Webex, and others) rather than a public self-service developer API. The
  company is backed by Felicis, GV, and IVP and is tracked in the API
  Evangelist network as a company profile.
